<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Рофл-кликер: Картаре</title>
<style>
:root{--red:#ff2a3d;--gold:#ffc83d;--bg:#07070c;--panel:#12121c;--line:#2a1a22}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 0,#2a0710 0,var(--bg) 60%);color:#eee;font-family:'Segoe UI',Tahoma,sans-serif;overflow-x:hidden}
.wrap{max-width:1000px;margin:0 auto;padding:14px;display:grid;grid-template-columns:1fr 340px;gap:18px}
@media(max-width:820px){.wrap{grid-template-columns:1fr}}
.main{text-align:center;position:relative}
.score{font-size:clamp(40px,9vw,72px);font-weight:900;color:var(--gold);text-shadow:0 0 20px #ff9d00,0 0 40px var(--red)}
.sub{color:#9a8f99;font-size:14px;min-height:20px}
.title{display:inline-block;margin:10px 0;padding:8px 20px;border:1px solid var(--gold);border-radius:30px;background:linear-gradient(90deg,#3a0a14,#2b1d05);color:var(--gold);font-weight:800;font-size:clamp(16px,4vw,22px);box-shadow:0 0 18px #ff2a3d66}
.bar{height:6px;background:#1c1c28;border-radius:4px;max-width:360px;margin:0 auto 8px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--red),var(--gold));transition:width .2s}
.stage{position:relative;display:flex;justify-content:center;align-items:center;padding:20px 0;min-height:calc(min(320px,72vw) + 250px)}
#avatar{position:relative;width:min(320px,72vw);aspect-ratio:1;border-radius:50%;border:5px solid var(--gold);overflow:hidden;cursor:pointer;
 background:radial-gradient(circle,#3a0a14,#0b0b12);box-shadow:0 0 25px var(--red),0 0 70px #ff2a3d88,inset 0 0 30px #000;transition:transform .06s;display:flex;align-items:center;justify-content:center;animation:pulse 2.5s infinite}
#avatar.hit{transform:scale(.93)}
#avatar span{position:absolute;font-size:38px;font-weight:900;color:var(--gold);letter-spacing:4px;text-shadow:0 0 12px var(--red)}
#avatar img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:var(--face-x,50%) var(--face-y,50%);border-radius:50%;pointer-events:none;z-index:2}
@keyframes pulse{50%{box-shadow:0 0 35px var(--red),0 0 100px #ff2a3daa,inset 0 0 30px #000}}
.ring{position:absolute;top:50%;left:50%;width:min(360px,80vw);aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;border:2px dashed #ffc83d66;animation:spin 14s linear infinite;pointer-events:none}
@keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}
.float{position:fixed;pointer-events:none;font-weight:900;color:var(--gold);text-shadow:0 0 8px #000,0 0 12px var(--red);animation:up .9s ease-out forwards;z-index:50;font-size:22px}
.float.crit{color:#ff4d5e;font-size:34px}
@keyframes up{to{transform:translateY(-90px);opacity:0}}
.part{position:fixed;width:7px;height:7px;border-radius:50%;background:var(--gold);box-shadow:0 0 8px var(--red);pointer-events:none;z-index:50;animation:fly .7s ease-out forwards}
@keyframes fly{to{transform:translate(var(--dx),var(--dy));opacity:0}}
.flash{position:fixed;inset:0;background:radial-gradient(circle,#ff2a3d99,transparent 70%);pointer-events:none;z-index:40;animation:fl .35s forwards}
@keyframes fl{to{opacity:0}}
.banner{position:fixed;top:30%;left:50%;transform:translate(-50%,-50%);font-size:clamp(40px,12vw,90px);font-weight:900;color:var(--gold);text-shadow:0 0 30px var(--red);pointer-events:none;z-index:60;animation:ban 1s forwards}
@keyframes ban{0%{scale:.3;opacity:0}20%{scale:1.2;opacity:1}100%{scale:1;opacity:0}}
.buffs{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;min-height:30px}
.buff{padding:4px 12px;border-radius:14px;background:#2b1d05;border:1px solid var(--gold);color:var(--gold);font-size:13px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:0 0 20px #0008}
.panel h3{margin:0 0 10px;color:var(--gold);letter-spacing:1px}
.up{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:10px;margin-bottom:8px;border:1px solid #333;border-radius:10px;background:#0e0e16;cursor:pointer;transition:.15s}
.up:hover{border-color:var(--red);box-shadow:0 0 12px #ff2a3d66;transform:translateX(-2px)}
.up.dis{opacity:.4;cursor:not-allowed}
.up b{color:#fff}.up small{color:#9a8f99;display:block;font-size:12px}
.cost{color:var(--gold);font-weight:800;white-space:nowrap}
.ach{font-size:13px;padding:5px 0;color:#666}.ach.got{color:var(--gold)}
#toasts{position:fixed;right:12px;top:12px;z-index:100;display:flex;flex-direction:column;gap:8px;max-width:300px}
.toast{background:linear-gradient(90deg,#3a0a14,#161620);border:1px solid var(--gold);border-left:5px solid var(--red);padding:10px 14px;border-radius:8px;box-shadow:0 0 18px #ff2a3d88;animation:ti .3s,to .4s 3.2s forwards}
.toast b{color:var(--gold)}
@keyframes ti{from{transform:translateX(120%)}}
@keyframes to{to{opacity:0;transform:translateX(120%)}}
#gold{position:fixed;display:none;width:84px;height:84px;border-radius:50%;border:3px solid #fff3b0;background:radial-gradient(circle at 35% 30%,#fff3b0,#ffb800 60%,#a86400);font-size:38px;cursor:pointer;z-index:70;box-shadow:0 0 30px #ffc83d;animation:gw 1s infinite}
@keyframes gw{50%{scale:1.15}}
.mobs{position:absolute;inset:0;pointer-events:none;z-index:5}
.mob{position:absolute;width:var(--s);height:var(--s);transform:translate(-50%,-50%);transition:left 2.2s ease-in-out,top 2.2s ease-in-out;pointer-events:auto;cursor:crosshair;animation:mobin .3s}
@keyframes mobin{from{scale:.2;opacity:0}}
.mob .memo{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:calc(var(--s)*.7);filter:drop-shadow(0 0 8px var(--red));animation:bob 1.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px) rotate(4deg)}}
.mob.hurt .memo{filter:brightness(2.5) drop-shadow(0 0 12px #fff);scale:.88}
.mob.die{transition:.35s;scale:1.6;opacity:0;pointer-events:none}
.mob .mt{position:absolute;left:50%;bottom:100%;transform:translateX(-50%);font-size:11px;font-weight:800;color:#fff;white-space:nowrap;text-shadow:0 0 4px #000,0 0 6px var(--red)}
.mob .mhp,.mob .mttl{height:6px;background:#1c1c28;border:1px solid #000;border-radius:4px;overflow:hidden;margin:1px 0}
.mob .mhp{position:absolute;left:0;right:0;top:-4px}
.mob .mhp i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#ff2a3d,#ff7a3d)}
.mob .mttl{position:absolute;left:0;right:0;top:-12px;height:4px}
.mob .mttl i{display:block;height:100%;width:100%;background:#4da6ff}
.mob.boss .memo{filter:drop-shadow(0 0 16px var(--gold)) drop-shadow(0 0 30px var(--red))}
.mob.boss .mt{font-size:15px;color:var(--gold);bottom:calc(100% + 8px)}
.mob.boss .mhp{height:10px;top:-6px}
input{user-select:text;-webkit-user-select:text}
.lb-row{display:flex;gap:8px;align-items:center}
.lb-row input{flex:1;min-width:0;background:#0e0e16;border:1px solid #333;border-radius:8px;color:#fff;padding:8px 10px;font-size:14px;outline:none}
.lb-row input:focus{border-color:var(--gold)}
.lb-btn{background:linear-gradient(90deg,#3a0a14,#2b1d05);border:1px solid var(--gold);color:var(--gold);border-radius:8px;padding:8px 10px;font-weight:800;cursor:pointer;white-space:nowrap}
.lb-btn:disabled{opacity:.45;cursor:not-allowed}
.lb-btn.sm{padding:8px 10px;border-color:#444;color:#aaa;background:none}
#lbmsg{font-size:12px;min-height:16px;margin:8px 0;color:#9a8f99}
.lb-item{display:grid;grid-template-columns:30px 1fr auto;gap:8px;padding:6px 4px;border-bottom:1px solid #222;font-size:14px}
.lb-item .pl{color:#9a8f99;font-weight:800}
.lb-item:nth-child(-n+3) .pl{color:var(--gold)}
.lb-item .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb-item .sc{color:var(--gold);font-weight:800}
.lb-item.me{background:#2b1d0555;border-radius:6px}
.reset{background:none;border:1px solid #444;color:#777;border-radius:8px;padding:6px 10px;margin-top:10px;cursor:pointer}
</style>
</head>

<script>
// ===== РЕДАКТИРУЙ ЗДЕСЬ: ТИТУЛЫ (порог по кликам) =====
const TITLES=[
 {at:0,name:"Ньюфаг"},{at:50,name:"Крип"},{at:150,name:"Работяга с картаре"},
 {at:300,name:"Рубик 🧙"},{at:600,name:"Мидер-неудачник"},{at:1000,name:"Папич картаре"},
 {at:2000,name:"Диана-симп"},{at:5000,name:"Легенда Доты"},{at:10000,name:"Бог картаре"}
];
// ===== ДОСТИЖЕНИЯ (cond получает состояние s и данные d) =====
const ACHS=[
 {id:"first",name:"Первый клик",desc:"Тыкнул разок",cond:s=>s.clicks>=1},
 {id:"rubick",name:"Рубик одобряет",desc:"300 кликов. Рубик украл твой скилл тыкать",cond:s=>s.clicks>=300},
 {id:"diana",name:"Диана бы гордилась",desc:"100 кликов подряд без паузы",cond:(s,d)=>d.streak>=100},
 {id:"grind",name:"Картаре-гриндер",desc:"1000 кликов",cond:s=>s.clicks>=1000},
 {id:"mid",name:"Хардкорный мид",desc:"50 кликов за 5 секунд",cond:(s,d)=>d.fast>=50},
 {id:"simp",name:"Симп Дианы",desc:"Купил «Подарок Диане»",cond:s=>(s.up.gift||0)>=1},
 {id:"crit",name:"Первый RUBICK!",desc:"Поймал крит",cond:s=>s.crits>=1},
 {id:"rich",name:"Золотой кошелёк",desc:"Набрал 10K очков. Купи уже Диане хоть цветы",cond:s=>s.total>=10000},
 {id:"goldc",name:"Рошан доволен",desc:"Поймал золотую кнопку",cond:s=>s.golds>=1},
 {id:"combo",name:"Комбо-мастер",desc:"Собрал 5 комбо",cond:s=>s.combos>=5},
 {id:"slayer",name:"Охотник на крипов",desc:"Убил 25 мобов",cond:s=>s.kills>=25},
 {id:"bossk",name:"Убийца боссов",desc:"Завалил первого босса",cond:s=>s.bossKills>=1},
 {id:"loot",name:"Лутер",desc:"Выбил 3 предмета",cond:s=>Object.values(s.items).reduce((a,b)=>a+b,0)>=3}
];
// ===== АПГРЕЙДЫ =====
const UPS=[
 {id:"skin",name:"Новый скин на Рубика",desc:"+1 к клику. Не меняет скилл, но выглядит дорого",base:25,g:1.18},
 {id:"coffee",name:"Кофе перед картаре",desc:"+2 очка/сек. Руки трясутся, зато тыкают",base:100,g:1.2},
 {id:"mmr",name:"MMR бустер",desc:"Авто-клик 1 раз/сек. Чужой аккаунт — чужие проблемы",base:400,g:1.25},
 {id:"diana",name:"Буст от Дианы",desc:"x2 ко всему на 30 сек. Она посмотрела на тебя!",base:800,g:1.1,consumable:true},
 {id:"gift",name:"Подарок Диане",desc:"+25 к клику и +20/сек. Симпить — это инвестиция",base:6000,g:1.6}
];
// ===================================================
const KEY="roflclicker_v1";
const $=id=>document.getElementById(id);
let S={score:0,total:0,clicks:0,crits:0,golds:0,combos:0,kills:0,bossKills:0,items:{},up:{},ach:{}};
let boosts={gold:0,diana:0,rage:0}; // время окончания
let streak=0,lastClick=0,comboN=0,times=[],fastMax=0,streakMax=0;
try{const x=JSON.parse(localStorage.getItem(KEY));if(x)S=Object.assign(S,x)}catch(e){}
const cnt=id=>S.up[id]||0;
const mult=()=>{const n=Date.now();return(boosts.gold>n?2:1)*(boosts.diana>n?2:1)*(1+0.1*(S.items.aegis||0))};
const clickVal=()=>1+cnt("skin")+cnt("gift")*25+(S.items.rapier||0)*5;
const perSec=()=>cnt("coffee")*2+cnt("gift")*20+(S.items.butterfly||0)*10+cnt("mmr")*clickVal();
const cost=u=>Math.floor(u.base*Math.pow(u.g,cnt(u.id)));
function fmt(n){n=Math.floor(n);if(n<1e3)return String(n);const u=["K","M","B","T","Qa"];let i=-1;while(n>=1e3&&i<u.length-1){n/=1e3;i++}return(n<10?n.toFixed(2):n<100?n.toFixed(1):Math.floor(n))+u[i]}
function toast(h){const t=document.createElement("div");t.className="toast";t.innerHTML=h;$("toasts").appendChild(t);setTimeout(()=>t.remove(),3700)}
function banner(t){const b=document.createElement("div");b.className="banner";b.textContent=t;document.body.appendChild(b);setTimeout(()=>b.remove(),1000)}
function add(n){S.score+=n;S.total+=n}
function checkAch(){ACHS.forEach(a=>{if(!S.ach[a.id]&&a.cond(S,{streak:streakMax,fast:fastMax})){S.ach[a.id]=1;toast("🏆 <b>"+a.name+"</b><br>"+a.desc);renderAch()}})}
function title(){let t=TITLES[0],n=null;for(let i=0;i<TITLES.length;i++){if(S.clicks>=TITLES[i].at){t=TITLES[i];n=TITLES[i+1]||null}}return{t,n}}
let lastTitle=title().t.name;
function fx(x,y,txt,crit){
 const f=document.createElement("div");f.className="float"+(crit?" crit":"");f.textContent=txt;f.style.left=(x-20+Math.random()*30)+"px";f.style.top=(y-30)+"px";document.body.appendChild(f);setTimeout(()=>f.remove(),900);
 for(let i=0;i<(crit?14:6);i++){const p=document.createElement("div");p.className="part";const a=Math.random()*6.28,d=40+Math.random()*70;
  p.style.left=x+"px";p.style.top=y+"px";p.style.setProperty("--dx",Math.cos(a)*d+"px");p.style.setProperty("--dy",Math.sin(a)*d+"px");if(crit)p.style.background="#ff4d5e";document.body.appendChild(p);setTimeout(()=>p.remove(),700)}
}
function click(e,auto){
 const now=Date.now();let x,y;
 if(e){const p=e.touches?e.touches[0]:e;x=p.clientX;y=p.clientY}else{const r=$("avatar").getBoundingClientRect();x=r.left+r.width/2;y=r.top+r.height/2}
 let val=clickVal()*mult(),crit=Math.random()<.1;
 if(crit){val*=5;S.crits++;banner(Math.random()<.5?"RUBICK!":"CRIT!");const f=document.createElement("div");f.className="flash";document.body.appendChild(f);setTimeout(()=>f.remove(),350)}
 S.clicks++;
 if(!auto){
  streak=(now-lastClick<1000)?streak+1:1;lastClick=now;streakMax=Math.max(streakMax,streak);
  comboN=(now-lastClick<=400||comboN===0)?comboN+1:1;
  times.push(now);times=times.filter(t=>now-t<5000);fastMax=Math.max(fastMax,times.length);
  if(comboN>=10){comboN=0;S.combos++;const b=clickVal()*mult()*50;val+=b;banner("COMBO!");toast("🔥 <b>COMBO!</b> +"+fmt(b))}
 }
 add(val);fx(x,y,"+"+fmt(val),crit);
 if(!auto){const a=$("avatar");a.classList.add("hit");setTimeout(()=>a.classList.remove("hit"),70)}
 checkAch();
}
$("avatar").addEventListener("pointerdown",e=>{e.preventDefault();click(e)});
// комбо: сбрасываем, если пауза >400мс
setInterval(()=>{if(Date.now()-lastClick>400)comboN=0;if(Date.now()-lastClick>1000)streak=0},200);
// пассив + автоклик
let acc=0,lastT=Date.now();
setInterval(()=>{const n=Date.now(),dt=(n-lastT)/1000;lastT=n;const v=perSec()*mult()*dt;if(v>0){add(v)}render()},100);
function buy(id){
 const u=UPS.find(x=>x.id===id),c=cost(u);if(S.score<c)return;
 S.score-=c;S.up[id]=cnt(id)+1;
 if(id==="diana"){boosts.diana=Math.max(Date.now(),boosts.diana)+30000}
 toast("🛒 Куплено: <b>"+u.name+"</b>");checkAch();renderShop();
}
function renderShop(){
 $("shop").innerHTML=UPS.map(u=>{const c=cost(u);return`<div class="up${S.score<c?" dis":""}" data-id="${u.id}"><div><b>${u.name}</b> <small>${u.desc}</small><small>Куплено: ${cnt(u.id)}</small></div><div class="cost">${fmt(c)}</div></div>`}).join("");
 $("shop").querySelectorAll(".up").forEach(el=>el.onclick=()=>buy(el.dataset.id));
}
function renderAch(){$("achs").innerHTML=ACHS.map(a=>`<div class="ach${S.ach[a.id]?" got":""}">${S.ach[a.id]?"🏆":"🔒"} ${a.name}${S.ach[a.id]?" — "+a.desc:""}</div>`).join("")}
let shopTick=0;
function render(){
 $("score").textContent=fmt(S.score);
 $("stats").textContent="Кликов: "+fmt(S.clicks)+"  •  +"+fmt(clickVal()*mult())+"/клик  •  +"+fmt(perSec()*mult())+"/сек";
 const {t,n}=title();$("title").textContent=t.name;
 if(t.name!==lastTitle){lastTitle=t.name;toast("👑 Новый титул: <b>"+t.name+"</b>");banner(t.name)}
 $("prog").style.width=n?Math.min(100,(S.clicks-t.at)/(n.at-t.at)*100)+"%":"100%";
 $("next").textContent=n?"До «"+n.name+"»: "+fmt(n.at-S.clicks)+" кликов":"Максимальный титул!";
 const now=Date.now();let b="";
 if(boosts.gold>now)b+=`<span class="buff">🛡️ Золото x2: ${Math.ceil((boosts.gold-now)/1000)}с</span>`;
 if(boosts.diana>now)b+=`<span class="buff">💖 Диана x2: ${Math.ceil((boosts.diana-now)/1000)}с</span>`;
 if(boosts.rage>now)b+=`<span class="buff">⚔️ Ярость x3 урон: ${Math.ceil((boosts.rage-now)/1000)}с</span>`;
 ITEMS.forEach(it=>{if(S.items[it.id])b+=`<span class="buff" title="${it.desc}">${it.e} ×${S.items[it.id]}</span>`});
 $("buffs").innerHTML=b;
 if(++shopTick%3===0)renderShop();
}
// золотая кнопка
function scheduleGold(){setTimeout(()=>{const g=$("gold");g.style.left=(10+Math.random()*(innerWidth-110))+"px";g.style.top=(80+Math.random()*(innerHeight-200))+"px";g.style.display="block";
 setTimeout(()=>{g.style.display="none";scheduleGold()},8000);g._t=1},20000+Math.random()*10000)}
$("gold").onclick=()=>{$("gold").style.display="none";boosts.gold=Math.max(Date.now(),boosts.gold)+15000;S.golds++;banner("x2 15 сек!");toast("🛡️ <b>Золотой Рошан!</b> x2 на 15 сек");checkAch()};
$("gold").addEventListener("click",()=>{},{once:false});
scheduleGold();
// ===== МОБЫ И БОССЫ (редактируй списки) =====
const MOBS=[
 {n:"Крип",e:"👹",hp:5,rw:1,s:58,w:5},
 {n:"Лесной волк",e:"🐺",hp:7,rw:1.6,s:60,w:4},
 {n:"Призрак",e:"👻",hp:9,rw:2.4,s:62,w:3},
 {n:"Голем",e:"🗿",hp:12,rw:3,s:70,w:3},
 {n:"Дракончик",e:"🐉",hp:18,rw:5,s:74,w:1.5}
];
const BOSSES=[
 {n:"РОШАН",e:"🐲",hp:50,rw:40,s:120},
 {n:"Король Лич",e:"💀",hp:70,rw:60,s:120},
 {n:"Кракен",e:"🦑",hp:90,rw:80,s:124},
 {n:"Тёмный Рубик",e:"🧙",hp:110,rw:100,s:120}
];
const ITEMS=[
 {id:"rapier",name:"Божественная Рапира",e:"🗡️",desc:"+5 к клику навсегда"},
 {id:"butterfly",name:"Бабочка",e:"🦋",desc:"+10 очков/сек навсегда"},
 {id:"aegis",name:"Аегис Бессмертия",e:"🧿",desc:"+10% ко всем очкам навсегда"}
];
let mobs=[],sinceBoss=0,nextBossAt=Date.now()+40000;
const rnd=(a,b)=>a+Math.random()*(b-a);
function pickMob(){const t=MOBS.reduce((a,m)=>a+m.w,0);let r=Math.random()*t;for(const m of MOBS){if((r-=m.w)<0)return m}return MOBS[0]}
function spot(size){
 const st=$("stage"),w=st.clientWidth,h=st.clientHeight,cx=w/2,cy=h/2,R=$("avatar").offsetWidth/2+size/2+10;
 for(let i=0;i<30;i++){const x=rnd(size/2+4,w-size/2-4),y=rnd(size/2+16,h-size/2-4);if(Math.hypot(x-cx,y-cy)>R)return[x,y]}
 const a=rnd(0,6.28);return[Math.min(w-size/2,Math.max(size/2,cx+Math.cos(a)*R)),Math.min(h-size/2,Math.max(size/2+16,cy+Math.sin(a)*R))];
}
function spawn(boss){
 const def=boss?BOSSES[S.bossKills%BOSSES.length]:pickMob();
 const hp=Math.ceil(def.hp*(1+S.bossKills*(boss?0.3:0.2)));
 const el=document.createElement("div");el.className="mob"+(boss?" boss":"");el.style.setProperty("--s",def.s+"px");
 el.innerHTML=`<div class="mt">${def.n}</div><div class="mhp"><i></i></div>${boss?'<div class="mttl"><i></i></div>':""}<div class="memo">${def.e}</div>`;
 const [x,y]=spot(def.s);el.style.left=x+"px";el.style.top=y+"px";
 $("mobs").appendChild(el);
 const m={el,def,boss,hp,max:hp,born:Date.now(),ttl:boss?30000:11000};
 el.addEventListener("pointerdown",e=>{e.preventDefault();e.stopPropagation();hit(m,e)});
 m.mv=setInterval(()=>{const p=spot(def.s);el.style.left=p[0]+"px";el.style.top=p[1]+"px"},boss?3200:2500);
 mobs.push(m);
 if(boss){banner("БОСС!");toast("☠️ Босс: <b>"+def.n+"</b>! Убей за 30 сек")}
}
function removeMob(m){m.dead=true;clearInterval(m.mv);m.el.classList.add("die");setTimeout(()=>m.el.remove(),400);mobs=mobs.filter(x=>x!==m)}
function hit(m,e){
 if(m.dead)return;
 let d=boosts.rage>Date.now()?3:1;const crit=Math.random()<.1;if(crit)d*=3;
 m.hp-=d;
 fx(e.clientX,e.clientY,"-"+d,crit);
 m.el.classList.add("hurt");setTimeout(()=>m.el.classList.remove("hurt"),90);
 m.el.querySelector(".mhp i").style.width=Math.max(0,m.hp/m.max*100)+"%";
 if(m.hp<=0)kill(m);
}
function kill(m){
 const r=m.el.getBoundingClientRect(),x=r.left+r.width/2,y=r.top+r.height/2;
 S.kills++;if(m.boss){S.bossKills++;sinceBoss=0;nextBossAt=Date.now()+70000}else sinceBoss++;
 const pts=Math.ceil((clickVal()*10+perSec()*6)*mult()*m.def.rw);
 add(pts);fx(x,y,"+"+fmt(pts)+" 💰",true);
 const drops=[];
 if(m.boss||Math.random()<.07){const it=ITEMS[Math.floor(Math.random()*ITEMS.length)];S.items[it.id]=(S.items[it.id]||0)+1;drops.push(it.e+" <b>"+it.name+"</b>: "+it.desc)}
 if(m.boss||Math.random()<.3){
  if(Math.random()<.5){const t=m.boss?20:10;boosts.gold=Math.max(Date.now(),boosts.gold)+t*1000;drops.push("🛡️ Золото x2 +"+t+"с")}
  else{const t=m.boss?25:12;boosts.rage=Math.max(Date.now(),boosts.rage)+t*1000;drops.push("⚔️ Ярость (урон по мобам x3) +"+t+"с")}
 }
 toast((m.boss?"☠️ <b>БОСС УБИТ: "+m.def.n+"</b>":"💥 Убит: <b>"+m.def.n+"</b>")+"<br>+"+fmt(pts)+" очков"+drops.map(d=>"<br>"+d).join(""));
 if(m.boss)banner("БОСС УБИТ!");
 removeMob(m);checkAch();render();
}
setInterval(()=>{
 const n=Date.now();
 mobs.slice().forEach(m=>{
  const left=m.ttl-(n-m.born);
  if(m.boss){const b=m.el.querySelector(".mttl i");if(b)b.style.width=Math.max(0,left/m.ttl*100)+"%"}
  if(left<=0){if(m.boss){toast("💨 Босс <b>"+m.def.n+"</b> сбежал!");nextBossAt=n+50000;sinceBoss=0}removeMob(m)}
 });
 const hasBoss=mobs.some(m=>m.boss),small=mobs.filter(m=>!m.boss).length;
 if(!hasBoss&&(n>=nextBossAt||sinceBoss>=15)){spawn(true);sinceBoss=0;nextBossAt=n+70000}
 else if(small<3&&Math.random()<.25)spawn(false);
},500);
// ===== ТАБЛИЦА ЛИДЕРОВ (Google Apps Script) =====
// Вставь сюда URL своего Web App (заканчивается на /exec)
const LB_URL="https://script.google.com/macros/s/AKfycbzhRCNTZ44S1nEMrlJ3nfVzlVqHsMgmDNc17zisEgKFKz-4_eO1KLB9tV5xaK6wGil6/execa";
const NICK_KEY="roflclicker_nick";
const lbOK=()=>/^https:\/\/script\.google\.com\//.test(LB_URL);
const esc=t=>String(t).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function lbMsg(t,bad){const m=$("lbmsg");m.textContent=t;m.style.color=bad?"#ff6b78":"#9a8f99"}
async function lbFetch(opts){
 const c=new AbortController(),t=setTimeout(()=>c.abort(),8000);
 try{const r=await fetch(LB_URL,Object.assign({signal:c.signal},opts||{}));if(!r.ok)throw new Error("http "+r.status);return await r.json()}
 finally{clearTimeout(t)}
}
function renderLB(top){
 const me=($("nick").value||"").trim().toLowerCase();
 $("lblist").innerHTML=top.length?top.map((p,i)=>`<div class="lb-item${p.name.toLowerCase()===me?" me":""}"><span class="pl">${i+1}</span><span class="nm">${esc(p.name)}</span><span class="sc">${Number(p.score).toLocaleString("ru-RU")}</span></div>`).join(""):'<div class="sub">Пока пусто — стань первым!</div>';
}
async function lbLoad(keepMsg){
 if(!lbOK()){lbMsg("Таблица не подключена: вставь URL в LB_URL",true);return}
 try{const d=await lbFetch();if(!d.ok)throw new Error(d.error);renderLB(d.top||[]);if(!keepMsg)lbMsg("")}
 catch(e){lbMsg("Не удалось загрузить таблицу (нет сети?)",true)}
}
let lbBusy=false;
async function lbSend(){
 if(lbBusy)return;
 const name=$("nick").value.trim().slice(0,20);
 if(!name){lbMsg("Введи ник",true);return}
 if(!lbOK()){lbMsg("Таблица не подключена: вставь URL в LB_URL",true);return}
 const score=Math.floor(S.total);
 if(score<=0){lbMsg("Сначала набери очков",true);return}
 try{localStorage.setItem(NICK_KEY,name)}catch(e){}
 lbBusy=true;$("lbsend").disabled=true;lbMsg("Отправляю…");
 try{
  const d=await lbFetch({method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({name,score})});
  if(!d.ok)throw new Error(d.error);
  toast("🏆 Результат отправлен: <b>"+fmt(score)+"</b>");
  await lbLoad(true);lbMsg("Отправлено: "+score.toLocaleString("ru-RU")+" очков");
 }catch(e){lbMsg("Не удалось отправить (нет сети?). Игра продолжается, попробуй позже",true)}
 finally{lbBusy=false;setTimeout(()=>{$("lbsend").disabled=false},3000)}
}
try{$("nick").value=localStorage.getItem(NICK_KEY)||""}catch(e){}
$("lbsend").onclick=lbSend;
$("lbref").onclick=()=>lbLoad();
$("nick").addEventListener("keydown",e=>{if(e.key==="Enter")lbSend()});
setInterval(()=>{if(!document.hidden&&!lbBusy)lbLoad(true)},60000);
// сохранение
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
setInterval(save,5000);addEventListener("beforeunload",save);
$("reset").onclick=()=>{if(confirm("Точно сбросить весь прогресс?")){localStorage.removeItem(KEY);location.reload()}};
renderAch();renderShop();render();lbLoad();
</script>
